<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 840" width="900" height="840" role="img" aria-label="Diagrama del proceso: archivo original, limpieza, HDFS, MapReduce, Databricks y hallazgos">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #dfe5ef; stroke-width: 1.4; }
      .box-dark { fill: #0d1626; stroke: #1d2a44; stroke-width: 1.4; }
      .t1 { font: 700 13px "Segoe UI", Inter, sans-serif; fill: #16203a; }
      .t1w { font: 700 13px "Segoe UI", Inter, sans-serif; fill: #ffffff; }
      .t2 { font: 400 11.5px "Segoe UI", Inter, sans-serif; fill: #5a6782; }
      .t2w { font: 400 11.5px "Segoe UI", Inter, sans-serif; fill: #9fb0cc; }
      .mono { font: 600 11.5px Consolas, "Cascadia Code", monospace; fill: #16203a; }
      .monow { font: 600 11.5px Consolas, "Cascadia Code", monospace; fill: #ffb4b8; }
      .lane { font: 700 10px "Segoe UI", Inter, sans-serif; fill: #8693ad; letter-spacing: 1.2px; }
      .lbl { font: 600 10.5px "Segoe UI", Inter, sans-serif; fill: #5a6782; }
      .flow { stroke: #b9c4d6; stroke-width: 1.6; fill: none; }
      .flow-dash { stroke: #b9c4d6; stroke-width: 1.6; fill: none; stroke-dasharray: 5 4; }
      .badge { font: 700 9.5px "Segoe UI", Inter, sans-serif; letter-spacing: .6px; }
    </style>
    <marker id="flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b9c4d6"/>
    </marker>
    <linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
  </defs>

  <rect width="900" height="840" fill="#f7f9fc"/>

  <!-- ================= LOCAL / PYTHON ================= -->
  <text x="40" y="32" class="lane">LOCAL · PYTHON + PANDAS</text>

  <rect x="290" y="46" width="320" height="84" rx="12" class="box"/>
  <text x="310" y="70" class="t1">1 · Origen de los datos</text>
  <text x="310" y="92" class="mono">netflix_titles.csv</text>
  <text x="310" y="112" class="t2">Kaggle · 8 807 filas · 12 columnas</text>

  <path d="M450 130 L450 168" class="flow" marker-end="url(#flecha)"/>
  <text x="462" y="154" class="lbl">lectura</text>

  <rect x="290" y="168" width="320" height="84" rx="12" class="box"/>
  <text x="310" y="192" class="t1">2 · Limpieza y normalización</text>
  <text x="310" y="214" class="mono">01_limpiar_netflix.py</text>
  <text x="310" y="234" class="t2">11 pasos · fechas dd/mm/aaaa · duration_min</text>

  <path d="M450 252 L450 290" class="flow" marker-end="url(#flecha)"/>
  <text x="462" y="276" class="lbl">11 operaciones</text>

  <rect x="290" y="290" width="320" height="92" rx="12" fill="#fff6f6" stroke="#f3c7ca" stroke-width="1.6"/>
  <text x="310" y="314" class="t1">3 · Fuente común</text>
  <text x="310" y="336" class="mono">netflix_clean.csv</text>
  <text x="310" y="356" class="t2">8 807 registros · 13 columnas · UTF-8</text>
  <rect x="520" y="302" width="74" height="18" rx="9" fill="#e50914"/>
  <text x="536" y="315" class="badge" fill="#ffffff">BASE</text>

  <!-- ================= HADOOP ================= -->
  <text x="40" y="432" class="lane">HADOOP · MAPREDUCE</text>

  <rect x="40" y="446" width="320" height="92" rx="12" class="box"/>
  <text x="60" y="470" class="t1">4 · HDFS + Hadoop Streaming</text>
  <text x="60" y="492" class="mono">02_mapper_actores.py</text>
  <text x="60" y="510" class="mono">02_reducer_actores.py</text>
  <text x="60" y="528" class="t2">/data/netflix/clean/ → results/actores/</text>

  <path d="M610 356 C 640 400, 470 406, 360 452" class="flow" marker-end="url(#flecha)"/>
  <text x="404" y="404" class="lbl">hdfs dfs -put</text>

  <rect x="40" y="578" width="320" height="88" rx="12" fill="#ffffff" stroke="#dfe5ef"/>
  <text x="60" y="602" class="t1">5 · Resultado por actor</text>
  <text x="60" y="624" class="mono">mapreduce_actores.csv</text>
  <text x="60" y="644" class="t2">36 439 actores · cantidad_titulos</text>

  <path d="M200 538 L200 578" class="flow" marker-end="url(#flecha)"/>
  <text x="212" y="562" class="lbl">part-00000</text>

  <!-- ================= DATABRICKS ================= -->
  <rect x="470" y="446" width="390" height="220" rx="14" fill="url(#gDark)" stroke="#1d2a44"/>
  <text x="492" y="474" class="t1w">6 · Databricks · Apache Spark</text>
  <text x="492" y="496" class="monow">workspace.netflix.netflix_clean</text>
  <text x="492" y="516" class="monow">workspace.netflix.mapreduce_actores</text>
  <line x1="492" y1="530" x2="838" y2="530" stroke="#24334f"/>
  <text x="492" y="552" class="t2w">A · Películas y series</text>
  <text x="492" y="572" class="t2w">B · Títulos por actor</text>
  <text x="492" y="592" class="t2w">C · Duración promedio por país</text>
  <text x="492" y="620" class="t2w">Cada análisis en SQL y en PySpark</text>
  <text x="492" y="642" class="t2w">Comparación completa por clave</text>

  <!-- carga directa -->
  <path d="M610 384 C 620 420, 520 424, 500 448" class="flow-dash" marker-end="url(#flecha)"/>
  <text x="626" y="414" class="lbl">carga directa</text>

  <!-- MR a Databricks -->
  <path d="M360 622 L470 622" class="flow" marker-end="url(#flecha)"/>
  <text x="364" y="614" class="lbl">mapreduce_actores.csv</text>

  <!-- ================= HALLAZGOS ================= -->
  <path d="M665 666 L665 712" class="flow" marker-end="url(#flecha)"/>
  <text x="677" y="694" class="lbl">resultados PySpark</text>

  <rect x="470" y="712" width="390" height="88" rx="12" class="box"/>
  <text x="492" y="736" class="t1">7 · Hallazgos del catálogo</text>
  <text x="492" y="758" class="t2">Gráfico de tipos · gráfico de actores</text>
  <text x="492" y="776" class="t2">Tabla 6 de duración por país · conclusiones</text>

  <text x="40" y="820" class="lbl">Los archivos transferidos se indican sobre cada flecha. Los pasos 4 y 5 ocurren en Hadoop; 6 y 7 en Databricks.</text>
</svg>
